image: alpine/edge
packages:
  - hut
  - nodejs
  - npm
oauth: pages.sr.ht/PAGES:RW
secrets:
  - 8bbfa982-22ea-4bf5-b058-6b25e72a93df
environment:
  site: dokoissho.srht.site
sources:
  - git@git.sr.ht:~dokoissho/digital-garden#v4
tasks:
  - build: |
      cd digital-garden
      npm ci
      npx quartz build
  - package: |
      cd digital-garden
      tar -C public -cvz . > ../site.tar.gz
  - upload: |
      hut pages publish -d $site site.tar.gz
