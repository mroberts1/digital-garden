image: alpine/edge
packages:
  - hut
  - nodejs
  - npm
oauth: pages.sr.ht/PAGES:RW
environment:
  site: dokoissho.srht.site
sources:
  - https://git.sr.ht/~dokoissho/digital-garden#v4
tasks:
  - build: |
      cd digital-garden
      npm ci
      npx quartz build
  - package: |
      cd digital-garden
      tar -C public -cvz . > ../site.tar.gz
  - upload: |
      hut pages publish -d $site site.tar.gz
