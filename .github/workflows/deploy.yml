name: Build and Deploy to sr.ht Pages

on:
  push:
    branches: [v4]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build site
        run: npx quartz build
      
      - name: Package site
        run: tar -C public -czf site.tar.gz .
      
      - name: Install hut
        run: sudo apt-get update && sudo apt-get install -y hut
          
      - name: Deploy to sr.ht Pages
        env:
          SRHT_TOKEN: ${{ secrets.SRHT_TOKEN }}
        run: |
          mkdir -p ~/.config/hut
          cat > ~/.config/hut/config <<EOF
          instance "sr.ht" {
            access-token "$SRHT_TOKEN"
          }
          EOF
          hut pages publish -d klara-sun.srht.site site.tar.gz
